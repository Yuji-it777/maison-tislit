[build]
  command = "npm run build:seo"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 301s: unprefixed URLs -> default locale (server-side, passes link equity)
# Root is forced so the 301 wins over the prerendered dist/index.html safety net.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/shop"
  to = "/en/shop/"
  status = 301

[[redirects]]
  from = "/product/:slug"
  to = "/en/product/:slug/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/en/about/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/en/contact/"
  status = 301

[[redirects]]
  from = "/cart"
  to = "/en/cart/"
  status = 301

[[redirects]]
  from = "/login"
  to = "/en/login/"
  status = 301

[[redirects]]
  from = "/checkout"
  to = "/en/checkout/"
  status = 301

[[redirects]]
  from = "/confirmation"
  to = "/en/confirmation/"
  status = 301

[[redirects]]
  from = "/account"
  to = "/en/account/"
  status = 301

[[redirects]]
  from = "/shipping"
  to = "/en/shipping/"
  status = 301

[[redirects]]
  from = "/returns"
  to = "/en/returns/"
  status = 301

# 301s: removed "-2" duplicate product pages -> real counterparts.
# Rows were deleted from the DB (migration 00022); :locale covers en and nl.
[[redirects]]
  from = "/:locale/product/emerald-royal-djellaba-2"
  to = "/:locale/product/emerald-royal-djellaba/"
  status = 301

[[redirects]]
  from = "/:locale/product/blue-safira-djellaba-2"
  to = "/:locale/product/blue-safira-djellaba/"
  status = 301

[[redirects]]
  from = "/:locale/product/nour-al-qamar-takchita-2"
  to = "/:locale/product/nour-al-qamar-takchita/"
  status = 301

[[redirects]]
  from = "/:locale/product/enchanted-rosa-takchita-2"
  to = "/:locale/product/enchanted-rosa-takchita/"
  status = 301

[[redirects]]
  from = "/:locale/product/bordeaux-sultana-gandoura-2"
  to = "/:locale/product/bordeaux-sultana-gandoura/"
  status = 301

[[redirects]]
  from = "/:locale/product/white-jasmine-gandoura-2"
  to = "/:locale/product/white-jasmine-gandoura/"
  status = 301

[[redirects]]
  from = "/:locale/product/embroidered-royal-caftan-2"
  to = "/:locale/product/embroidered-royal-caftan/"
  status = 301

[[redirects]]
  from = "/:locale/product/fassi-takchita-2"
  to = "/:locale/product/fassi-takchita/"
  status = 301

[[redirects]]
  from = "/:locale/product/silk-jabador-2"
  to = "/:locale/product/silk-jabador/"
  status = 301

[[redirects]]
  from = "/:locale/product/golden-belt-2"
  to = "/:locale/product/golden-belt/"
  status = 301

# Removed category collections: takchita + jabador 301 to the closest
# surviving collection so old links (and Google equity) don't 404.
[[redirects]]
  from = "/:locale/shop/takchita"
  to = "/:locale/shop/caftan/"
  status = 301

[[redirects]]
  from = "/:locale/shop/jabador"
  to = "/:locale/shop/djellaba/"
  status = 301

# Renamed product slugs (migration 00026 + dashboard renames): old product
# URLs -> current slugs, covering every naming era.
[[redirects]]
  from = "/:locale/product/nour-al-qamar-takchita"
  to = "/:locale/product/nour-al-qamar-caftan/"
  status = 301

[[redirects]]
  from = "/:locale/product/enchanted-rosa-takchita"
  to = "/:locale/product/enchanted-rosa-caftan/"
  status = 301

[[redirects]]
  from = "/:locale/product/fassi-takchita"
  to = "/:locale/product/fassi-caftan/"
  status = 301

[[redirects]]
  from = "/:locale/product/silk-jabador"
  to = "/:locale/product/majorelle-blue-gandoura/"
  status = 301

[[redirects]]
  from = "/:locale/product/bordeaux-sultana-gandoura"
  to = "/:locale/product/royal-sand-gandoura/"
  status = 301

[[redirects]]
  from = "/:locale/product/white-jasmine-gandoura"
  to = "/:locale/product/terracotta-satin-gandoura/"
  status = 301

[[redirects]]
  from = "/:locale/product/silk-gandoura"
  to = "/:locale/product/majorelle-blue-gandoura/"
  status = 301

# Rewrites: Return 200 OK directly for /en and /nl (no redirect chain)
[[redirects]]
  from = "/en"
  to = "/en/"
  status = 200
  force = true

[[redirects]]
  from = "/nl"
  to = "/nl/"
  status = 200
  force = true

# Rewrite: /en/shop (slashless) serves snapshot directly with 200, no redirect.
# Mirrors public/_redirects for Cloudflare Pages. Applies to all UAs including
# Googlebot. Scoped to this route only — other routes unchanged.
[[redirects]]
  from = "/en/shop"
  to = "/en/shop/"
  status = 200
  force = true

# SPA fallback: only reached when no static file exists at the path
# (static files take precedence over non-forced redirects)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200