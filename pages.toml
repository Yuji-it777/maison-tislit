# Cloudflare Pages build configuration
# https://developers.cloudflare.com/pages/configuration/

[build]
  # NOTE: Cloudflare Pages does not read this file — enter these values in the
  # dashboard (Settings → Build & deployments). They live here as documentation.
  # --with-deps was removed: it runs apt-get with sudo, which the Cloudflare build
  # image does not allow. The image already ships the system libraries Chromium
  # needs, so installing the browser alone is enough.
  command = "npm run build:cf"
  destination = "dist"

[build.environment]
  NODE_VERSION = "22"
  # All VITE_ env vars must be set in Cloudflare Pages dashboard:
  # Settings → Environment Variables → Production
  # Required:
  #   VITE_SUPABASE_URL
  #   VITE_SUPABASE_ANON_KEY
  #   VITE_TURNSTILE_SITE_KEY
  #   VITE_SITE_URL = https://maisontislit.com
  #   VITE_WHATSAPP_NUMBER = 31620813588
